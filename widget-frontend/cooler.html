<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooler Zone Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    .container {
      display: inline-flex;
      padding: 6px;
      background: transparent;
    }

    /* Glassmorphic Compact Card (Perfect Fit for Cupola) */
    .card {
      width: 310px;
      border-radius: 18px;
      padding: 13px 15px;
      color: #ffffff;
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      background: rgba(15, 118, 110, 0.35);
      border: 1px solid rgba(45, 212, 191, 0.45);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), inset 0 0 20px rgba(20, 184, 166, 0.25);
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 14px 36px -5px rgba(0, 0, 0, 0.55), inset 0 0 25px rgba(20, 184, 166, 0.35);
    }

    /* Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      padding-bottom: 8px;
    }

    .card-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-icon {
      font-size: 20px;
      line-height: 1;
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ccfbf1;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    /* Sensor Grid */
    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sensor-box {
      background: rgba(15, 23, 42, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      backdrop-filter: blur(8px);
    }

    .sensor-label {
      font-size: 18px;
      font-weight: 700;
      color: #99f6e4;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
    }

    .sensor-value-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 2px;
    }

    .sensor-value {
      font-size: 30px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 10px rgba(45, 212, 191, 0.5);
    }

    .sensor-unit {
      font-size: 17px;
      font-weight: 700;
      color: #5eead4;
    }

    /* Controls Section (Blower) */
    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      padding-top: 9px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 8px 12px;
      gap: 8px;
    }

    .control-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .control-name {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .control-status-text {
      display: none;
    }

    /* Toggle Buttons */
    .btn-group {
      display: flex;
      gap: 6px;
    }

    .state-btn {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 5px 13px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.10);
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      outline: none;
      transition: all 0.18s ease;
      backdrop-filter: blur(6px);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .state-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.20);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .state-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .state-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Active ON / OFF states */
    .state-btn.on.active {
      background: #16a34a;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.65);
    }

    .state-btn.off.active {
      background: #dc2626;
      border-color: #f87171;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.65);
    }
  </style>
  <link rel="stylesheet" href="/css/custom-cards.css" />
</head>

<body data-card="cooler">
  <div class="container">
    <div class="card">
      <!-- Header -->
      <div class="card-header">
        <div class="card-title-wrap">
          <span class="card-icon">❄️</span>
          <span class="card-title">Cooler Zone</span>
        </div>
      </div>

      <!-- Sensor Readings -->
      <div class="sensor-grid">
        <!-- Temperature -->
        <div class="sensor-box">
          <span class="sensor-label">Temperature</span>
          <div class="sensor-value-row">
            <span class="sensor-value" id="val-temp">--</span>
            <span class="sensor-unit">°C</span>
          </div>
        </div>

        <!-- Humidity -->
        <div class="sensor-box">
          <span class="sensor-label">Humidity</span>
          <div class="sensor-value-row">
            <span class="sensor-value" id="val-hum">--</span>
            <span class="sensor-unit">%</span>
          </div>
        </div>
      </div>

      <!-- Blower Control Section -->
      <div class="controls-section">
        <div class="control-row">
          <div class="control-info">
            <span class="control-name">Cooler</span>
            <span class="control-status-text" id="status-blower">OFF</span>
          </div>
          <div class="btn-group">
            <button class="state-btn on" id="btn-blower-on"
              onclick="sendActuatorCommand('heat_blower', 'on')">ON</button>
            <button class="state-btn off active" id="btn-blower-off"
              onclick="sendActuatorCommand('heat_blower', 'off')">OFF</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const backendProtocol = window.location.protocol === "https:" ? "https:" : "http:";
    const websocketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const API_BASE = `${backendProtocol}//${window.location.hostname}:4000`;
    const WS_URL = `${websocketProtocol}//${window.location.hostname}:4000/ws`;

    const tempEl = document.getElementById("val-temp");
    const humEl = document.getElementById("val-hum");
    const blowerStatusEl = document.getElementById("status-blower");
    const btnBlowerOn = document.getElementById("btn-blower-on");
    const btnBlowerOff = document.getElementById("btn-blower-off");

    function updateSensor(el, val, decimals = 1) {
      if (val === null || val === undefined) {
        el.textContent = "--";
        return;
      }
      const num = Number(val);
      if (isNaN(num)) {
        el.textContent = val;
        return;
      }
      el.textContent = Number.isInteger(num) ? num : num.toFixed(decimals);
    }

    function updateActuatorUI(id, state) {
      const isOn = state === "on";
      if (id === "heat_blower") {
        blowerStatusEl.textContent = isOn ? "ON" : "OFF";
        blowerStatusEl.style.color = isOn ? "#4ade80" : "#5eead4";
        btnBlowerOn.classList.toggle("active", isOn);
        btnBlowerOff.classList.toggle("active", !isOn);
        btnBlowerOn.disabled = false;
        btnBlowerOff.disabled = false;
      }
    }

    async function sendActuatorCommand(id, cmd) {
      btnBlowerOn.disabled = true;
      btnBlowerOff.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/item/${id}/action`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: cmd }),
        });
        if (!res.ok) throw new Error("Failed");
        updateActuatorUI(id, cmd);
      } catch (err) {
        console.error("Failed to send command:", err);
      } finally {
        btnBlowerOn.disabled = false;
        btnBlowerOff.disabled = false;
      }
    }

    // 1. Initial Snapshot fetch from backend store
    async function fetchInitialSnapshots() {
      const items = ["cooler_dht_temp", "cooler_dht_humidity", "heat_blower"];
      for (const id of items) {
        try {
          const res = await fetch(`${API_BASE}/api/item/${id}`);
          if (res.ok) {
            const data = await res.json();
            handleDataUpdate(id, data.value);
          }
        } catch (e) { }
      }
    }
    fetchInitialSnapshots();

    function handleDataUpdate(itemId, val) {
      if (itemId === "cooler_dht_temp") {
        updateSensor(tempEl, val, 1);
      } else if (itemId === "cooler_dht_humidity") {
        updateSensor(humEl, val, 0);
      } else if (itemId === "heat_blower") {
        updateActuatorUI(itemId, val);
      }
    }

    // 2. Real-time WebSocket connection to backend MQTT store
    function connectSocket() {
      const ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "subscribe",
          items: ["cooler_dht_temp", "cooler_dht_humidity", "heat_blower"]
        }));
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "update" && msg.item_id) {
            handleDataUpdate(msg.item_id, msg.value);
          }
        } catch (err) { }
      };
      ws.onclose = () => setTimeout(connectSocket, 2000);
      ws.onerror = () => ws.close();
    }
    connectSocket();
  </script>
</body>

</html>
