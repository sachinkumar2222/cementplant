<!DOCTYPE html>
<!--
  Industrial Load Cell & Sensor Telemetry Card (Architecture v5)
  Specialized for Real-Time Weight Monitoring & Overload / Underload Alarms
  
  Usage:
    widget.html?id=iron_ore
    widget.html?id=gypsum
    widget.html?id=clay
    widget.html?id=sand
    widget.html?id=vibration_sensor
    Optional parameters:
      &overload=20  (overload threshold, default 20)
      &underload=5  (underload threshold, default 5)
      &decimals=2   (decimal places, default 2)
      &size=20px    (custom title size, default 20px)
      &view=compact (compact pill display mode)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Material Load & Sensor Telemetry</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    .widget-root {
      display: inline-flex;
      padding: 6px;
      background: transparent;
    }

    /* =========================================================================
     * 🌟 GLASSMORPHIC INDUSTRIAL LOAD CARD (Matches other-three & gypsum transparency)
     * ========================================================================= */
    .load-card {
      position: relative;
      width: 290px;
      border-radius: 18px;
      padding: 16px 18px;
      color: #ffffff;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Material Specific Accents — Identical transparent glass as dispense cards */
    /* 1. Iron Ore (Crimson / Rose) */
    .theme-iron_ore {
      background: rgba(190, 18, 60, 0.30);
      border: 1px solid rgba(251, 113, 133, 0.45);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(244, 63, 94, 0.2);
    }
    .theme-iron_ore .material-title { color: #fda4af; }

    /* 2. Clay (Purple / Violet) */
    .theme-clay {
      background: rgba(109, 40, 217, 0.30);
      border: 1px solid rgba(192, 132, 252, 0.45);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(168, 85, 247, 0.2);
    }
    .theme-clay .material-title { color: #d8b4fe; }

    /* 3. Sand (Amber / Orange) */
    .theme-sand {
      background: rgba(194, 65, 12, 0.30);
      border: 1px solid rgba(251, 146, 60, 0.45);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(249, 115, 22, 0.2);
    }
    .theme-sand .material-title { color: #fdba74; }

    /* 4. Gypsum (Royal Blue) */
    .theme-gypsum {
      background: rgba(30, 64, 175, 0.30);
      border: 1px solid rgba(147, 197, 253, 0.45);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(59, 130, 246, 0.2);
    }
    .theme-gypsum .material-title { color: #93c5fd; }

    /* 5. General Sensors / Default (Cyan / Slate) */
    .theme-sensor {
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(56, 189, 248, 0.2);
    }
    .theme-sensor .material-title { color: #7dd3fc; }

    /* Header Bar */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .material-icon {
      font-size: 20px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
    }

    .material-title {
      font-size: 18px !important;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
      line-height: 1.2;
    }

    /* Value Display Area */
    .value-display-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 0;
    }

    .value-group {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
    }

    .telemetry-val {
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95), 0 0 16px rgba(255, 255, 255, 0.3);
      font-variant-numeric: tabular-nums;
    }

    .telemetry-unit {
      font-size: 17px;
      font-weight: 700;
      opacity: 0.88;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.01em;
    }

    /* Load Status Indicator Pill */
    .load-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    /* State: NORMAL */
    .status-normal {
      background: rgba(16, 185, 129, 0.20);
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #6ee7b7;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
    }
    .status-normal .status-dot {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    /* State: OVERLOAD */
    .status-overload {
      background: rgba(239, 68, 68, 0.32);
      border: 1.5px solid rgba(248, 113, 113, 0.8);
      color: #fee2e2;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.55);
      animation: alert-pulse 1s infinite alternate;
    }
    .status-overload .status-dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    /* State: UNDERLOAD */
    .status-underload {
      background: rgba(245, 158, 11, 0.30);
      border: 1.5px solid rgba(251, 191, 36, 0.75);
      color: #fef9c3;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.5);
      animation: alert-pulse 1.2s infinite alternate;
    }
    .status-underload .status-dot {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    @keyframes alert-pulse {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.04); filter: brightness(1.25); }
    }

    /* Compact Pill Mode (Activated via ?view=compact) */
    .load-card.compact-view {
      width: auto;
      border-radius: 12px;
      padding: 8px 14px;
      flex-direction: row;
      align-items: center;
      gap: 12px;
    }
    .load-card.compact-view .telemetry-val {
      font-size: 24px;
    }
  </style>
  <link rel="stylesheet" href="/css/custom-cards.css" />
</head>

<body data-card="telemetry">
  <div class="widget-root">
    <div class="load-card theme-iron_ore" id="main-card">
      
      <!-- Top Header Row -->
      <div class="card-header">
        <div class="title-group">
          <span class="material-icon" id="card-icon">🪨</span>
          <span class="material-title" id="card-title">IRON ORE HOPPER</span>
        </div>
      </div>

      <!-- Main Telemetry Value & Status Badge -->
      <div class="value-display-row">
        <div class="value-group">
          <span class="telemetry-val" id="val">--</span>
          <span class="telemetry-unit" id="unit">g</span>
        </div>
        <div class="load-status-badge status-normal" id="status-badge">
          <span class="status-dot"></span>
          <span id="status-text">NORMAL LOAD</span>
        </div>
      </div>

    </div>
  </div>

  <script src="js/ws-client.js"></script>
  <script>
    /* =========================================================================
     * 🎛️ CONFIGURATION & MATERIAL DEFINITIONS
     * ========================================================================= */
    const MATERIAL_CONFIGS = {
      iron_ore: {
        title: "IRON ORE HOPPER",
        icon: "🪨",
        theme: "theme-iron_ore",
        defaultUnit: "g",
        isHopper: true,
      },
      clay: {
        title: "CLAY HOPPER",
        icon: "🏺",
        theme: "theme-clay",
        defaultUnit: "g",
        isHopper: true,
      },
      sand: {
        title: "SAND HOPPER",
        icon: "⏳",
        theme: "theme-sand",
        defaultUnit: "g",
        isHopper: true,
      },
      gypsum: {
        title: "GYPSUM HOPPER",
        icon: "🧱",
        theme: "theme-gypsum",
        defaultUnit: "g",
        isHopper: true,
      },
      limestone: {
        title: "LIMESTONE GATE",
        icon: "⛰️",
        theme: "theme-sensor",
        defaultUnit: "",
        isHopper: false,
      },
      lime_stone: {
        title: "LIMESTONE GATE",
        icon: "⛰️",
        theme: "theme-sensor",
        defaultUnit: "",
        isHopper: false,
      },
      vibration_sensor: {
        title: "VIBRATION SENSOR",
        icon: "⚡",
        theme: "theme-sensor",
        defaultUnit: "",
        isHopper: false,
      },
      klin_dht_temp: {
        title: "KILN TEMPERATURE",
        icon: "🔥",
        theme: "theme-iron_ore",
        defaultUnit: "°C",
        isHopper: false,
      },
      klin_dht_humidity: {
        title: "KILN HUMIDITY",
        icon: "💧",
        theme: "theme-clay",
        defaultUnit: "%",
        isHopper: false,
      },
      cooler_dht_temp: {
        title: "COOLER TEMPERATURE",
        icon: "❄️",
        theme: "theme-gypsum",
        defaultUnit: "°C",
        isHopper: false,
      },
      cooler_dht_humidity: {
        title: "COOLER HUMIDITY",
        icon: "💧",
        theme: "theme-sand",
        defaultUnit: "%",
        isHopper: false,
      },
      preheating_tower_dht_temp: {
        title: "PREHEAT TOWER TEMP",
        icon: "🗼",
        theme: "theme-iron_ore",
        defaultUnit: "°C",
        isHopper: false,
      },
      preheating_tower_dht_humidity: {
        title: "PREHEAT TOWER HUMIDITY",
        icon: "💧",
        theme: "theme-clay",
        defaultUnit: "%",
        isHopper: false,
      }
    };

    // Parse URL Parameters
    const params = new URLSearchParams(window.location.search);
    const rawId = params.get("id") || "iron_ore";
    const itemId = rawId.toLowerCase().trim();

    // Thresholds
    const OVERLOAD_THRESHOLD = parseFloat(params.get("overload")) || 20.0;
    const UNDERLOAD_THRESHOLD = parseFloat(params.get("underload")) || 5.0;

    // Formatting options
    const decimalsParam = params.get("decimals");
    const numDecimals = decimalsParam !== null && !isNaN(decimalsParam) ? parseInt(decimalsParam, 10) : 2;
    const isCompact = params.get("view") === "compact" || params.get("compact") === "true";

    // DOM Elements
    const cardEl = document.getElementById("main-card");
    const titleEl = document.getElementById("card-title");
    const iconEl = document.getElementById("card-icon");
    const valEl = document.getElementById("val");
    const unitEl = document.getElementById("unit");
    const statusBadge = document.getElementById("status-badge");
    const statusText = document.getElementById("status-text");

    // Initialize Card Theme & Titles
    const cfg = MATERIAL_CONFIGS[itemId] || {
      title: `${itemId.replace(/_/g, " ").toUpperCase()}`,
      icon: "📊",
      theme: "theme-sensor",
      defaultUnit: "",
      isHopper: false,
    };

    cardEl.className = `load-card ${cfg.theme} ${isCompact ? "compact-view" : ""}`;
    titleEl.textContent = cfg.title;
    iconEl.textContent = cfg.icon;
    unitEl.textContent = cfg.defaultUnit;

    if (!cfg.isHopper) {
      statusBadge.style.display = "none";
    }

    // Backend Protocols
    const backendProtocol = window.location.protocol === "https:" ? "https:" : "http:";
    const websocketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const API_BASE = `${backendProtocol}//${window.location.hostname}:4000`;
    const WS_URL = `${websocketProtocol}//${window.location.hostname}:4000/ws`;

    /* =========================================================================
     * 📊 TELEMETRY & LOAD STATUS RENDERER
     * ========================================================================= */
    function renderTelemetry(value, unit) {
      if (value === null || value === undefined || value === "") {
        valEl.textContent = "--";
        if (cfg.isHopper) {
          statusBadge.className = "load-status-badge status-normal";
          statusText.textContent = "WAITING";
        }
        return;
      }

      const numVal = parseFloat(value);
      if (isNaN(numVal)) {
        valEl.textContent = value;
        return;
      }

      const clampedVal = numVal < 0 ? 0 : numVal;
      valEl.textContent = clampedVal.toFixed(numDecimals);
      if (unit) unitEl.textContent = unit;

      // Handle Hoppers: Overload & Underload Logic
      if (cfg.isHopper) {
        if (clampedVal > OVERLOAD_THRESHOLD) {
          // 🔴 OVERLOAD STATE
          statusBadge.className = "load-status-badge status-overload";
          statusText.textContent = "OVERLOAD ALARM";
        } else if (clampedVal < UNDERLOAD_THRESHOLD) {
          // 🟡 UNDERLOAD STATE
          statusBadge.className = "load-status-badge status-underload";
          statusText.textContent = "UNDERLOAD ALARM";
        } else {
          // 🟢 NORMAL / SAFE LOAD STATE
          statusBadge.className = "load-status-badge status-normal";
          statusText.textContent = "NORMAL LOAD";
        }
      }
    }

    /* =========================================================================
     * 🌐 NETWORK CONNECTION (HTTP SNAPSHOT + REALTIME WEBSOCKET)
     * ========================================================================= */
    // 1. Initial REST snapshot for instant zero-delay render
    fetch(`${API_BASE}/api/item/${itemId}`)
      .then((res) => (res.ok ? res.json() : null))
      .then((data) => {
        if (data && data.value !== undefined) {
          renderTelemetry(data.value, data.unit || cfg.defaultUnit);
        }
      })
      .catch(() => {});

    // 2. Real-time WebSocket Subscription via ws-client.js
    if (typeof connectWidgetSocket === "function") {
      connectWidgetSocket(WS_URL, itemId, (data) => {
        if (data && data.value !== undefined) {
          renderTelemetry(data.value, data.unit || cfg.defaultUnit);
        }
      });
    } else {
      // Robust Fallback WebSocket connection
      function connectFallbackWS() {
        try {
          const ws = new WebSocket(WS_URL);
          ws.onopen = () => {
            ws.send(JSON.stringify({ type: "subscribe", item_id: itemId }));
          };
          ws.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === "update" && (msg.item_id === itemId || !msg.item_id)) {
                renderTelemetry(msg.value, msg.unit || cfg.defaultUnit);
              }
            } catch (e) {}
          };
          ws.onclose = () => setTimeout(connectFallbackWS, 2000);
          ws.onerror = () => ws.close();
        } catch (e) {
          setTimeout(connectFallbackWS, 2000);
        }
      }
      connectFallbackWS();
    }
  </script>
</body>
</html>
