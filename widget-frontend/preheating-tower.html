<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preheating Tower Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    ::-webkit-scrollbar {
      display: none;
    }

    .container {
      display: inline-flex;
      padding: 12px;
      background: transparent;
    }

    /* Glassmorphic Preheating Tower Card (Optimized for Big Screen) */
    .card {
      width: 400px;
      border-radius: 24px;
      padding: 22px 24px;
      color: #ffffff;
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      background: rgba(88, 28, 135, 0.38);
      border: 1.5px solid rgba(192, 132, 252, 0.50);
      box-shadow: 0 16px 44px -8px rgba(0, 0, 0, 0.55), inset 0 0 30px rgba(168, 85, 247, 0.30);
      display: flex;
      flex-direction: column;
      gap: 16px;
      user-select: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      box-shadow: 0 20px 50px -8px rgba(0, 0, 0, 0.65), inset 0 0 35px rgba(168, 85, 247, 0.42);
    }

    /* Header (No ESP badge - clean & bold) */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.18);
      padding-bottom: 12px;
    }
    .card-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-icon {
      font-size: 26px;
      line-height: 1;
    }
    .card-title {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f5d0fe;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }

    /* Sensor Grid (Big numbers for distant viewing) */
    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .sensor-box {
      background: rgba(15, 23, 42, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      backdrop-filter: blur(10px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .sensor-box:hover {
      background: rgba(15, 23, 42, 0.60);
      border-color: rgba(216, 180, 254, 0.5);
    }
    .sensor-label {
      font-size: 15px;
      font-weight: 800;
      color: #e9d5ff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }
    .sensor-value-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 2px;
    }
    .sensor-value {
      font-size: 34px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 14px rgba(168, 85, 247, 0.6);
    }
    .sensor-unit {
      font-size: 20px;
      font-weight: 800;
      color: #d8b4fe;
    }

    /* Controls Section */
    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1.5px solid rgba(255, 255, 255, 0.18);
      padding-top: 14px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.40);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 15px;
      padding: 12px 16px;
      gap: 12px;
    }
    .control-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .control-name {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }
    .control-status-text {
      font-size: 14px;
      font-weight: 700;
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Big Interactive Toggle Buttons */
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .state-btn {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.05em;
      padding: 9px 20px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      outline: none;
      transition: all 0.18s ease;
      backdrop-filter: blur(8px);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }
    .state-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .state-btn:active:not(:disabled) {
      transform: scale(0.96);
    }
    .state-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Active ON / OFF states */
    .state-btn.on.active {
      background: #16a34a;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.75);
    }
    .state-btn.off.active {
      background: #dc2626;
      border-color: #f87171;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.75);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Header -->
      <div class="card-header">
        <div class="card-title-wrap">
          <span class="card-icon">🗼</span>
          <span class="card-title">Preheating Tower</span>
        </div>
      </div>

      <!-- Sensor Readings -->
      <div class="sensor-grid">
        <!-- Temperature -->
        <div class="sensor-box">
          <span class="sensor-label">🌡️ Temperature</span>
          <div class="sensor-value-row">
            <span class="sensor-value" id="val-temp">--</span>
            <span class="sensor-unit">°C</span>
          </div>
        </div>

        <!-- Humidity -->
        <div class="sensor-box">
          <span class="sensor-label">💧 Humidity</span>
          <div class="sensor-value-row">
            <span class="sensor-value" id="val-hum">--</span>
            <span class="sensor-unit">%</span>
          </div>
        </div>
      </div>

      <!-- Actuator Controls -->
      <div class="controls-section">
        <!-- Preheating Heater -->
        <div class="control-row">
          <div class="control-info">
            <span class="control-name">Heater</span>
            <span class="control-status-text" id="status-heater">OFF</span>
          </div>
          <div class="btn-group">
            <button class="state-btn on" id="btn-heater-on" onclick="sendActuatorCommand('preheating_tower_heater', 'on')">ON</button>
            <button class="state-btn off active" id="btn-heater-off" onclick="sendActuatorCommand('preheating_tower_heater', 'off')">OFF</button>
          </div>
        </div>

        <!-- Preheating Fan -->
        <div class="control-row">
          <div class="control-info">
            <span class="control-name">Fan</span>
            <span class="control-status-text" id="status-fan">OFF</span>
          </div>
          <div class="btn-group">
            <button class="state-btn on" id="btn-fan-on" onclick="sendActuatorCommand('preheating_tower_fan', 'on')">ON</button>
            <button class="state-btn off active" id="btn-fan-off" onclick="sendActuatorCommand('preheating_tower_fan', 'off')">OFF</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const backendProtocol = window.location.protocol === "https:" ? "https:" : "http:";
    const websocketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const API_BASE = `${backendProtocol}//${window.location.hostname}:4000`;
    const WS_URL   = `${websocketProtocol}//${window.location.hostname}:4000/ws`;

    // Elements
    const tempEl = document.getElementById("val-temp");
    const humEl = document.getElementById("val-hum");
    const heaterStatusEl = document.getElementById("status-heater");
    const fanStatusEl = document.getElementById("status-fan");
    const btnHeaterOn = document.getElementById("btn-heater-on");
    const btnHeaterOff = document.getElementById("btn-heater-off");
    const btnFanOn = document.getElementById("btn-fan-on");
    const btnFanOff = document.getElementById("btn-fan-off");

    function updateSensor(el, val, decimals = 1) {
      if (val === null || val === undefined) {
        el.textContent = "--";
        return;
      }
      const num = Number(val);
      if (isNaN(num)) {
        el.textContent = val;
        return;
      }
      el.textContent = Number.isInteger(num) ? num : num.toFixed(decimals);
    }

    function updateActuatorUI(id, state) {
      const isOn = state === "on";
      if (id === "preheating_tower_heater") {
        heaterStatusEl.textContent = isOn ? "ON" : "OFF";
        heaterStatusEl.style.color = isOn ? "#4ade80" : "#c084fc";
        btnHeaterOn.classList.toggle("active", isOn);
        btnHeaterOff.classList.toggle("active", !isOn);
        btnHeaterOn.disabled = false;
        btnHeaterOff.disabled = false;
      } else if (id === "preheating_tower_fan") {
        fanStatusEl.textContent = isOn ? "ON" : "OFF";
        fanStatusEl.style.color = isOn ? "#4ade80" : "#c084fc";
        btnFanOn.classList.toggle("active", isOn);
        btnFanOff.classList.toggle("active", !isOn);
        btnFanOn.disabled = false;
        btnFanOff.disabled = false;
      }
    }

    async function sendActuatorCommand(id, cmd) {
      if (id === "preheating_tower_heater") {
        btnHeaterOn.disabled = true;
        btnHeaterOff.disabled = true;
      } else {
        btnFanOn.disabled = true;
        btnFanOff.disabled = true;
      }

      try {
        const res = await fetch(`${API_BASE}/api/item/${id}/action`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: cmd }),
        });
        if (!res.ok) throw new Error("Failed");
        updateActuatorUI(id, cmd);
      } catch (err) {
        console.error("Failed to send command:", err);
      } finally {
        if (id === "preheating_tower_heater") {
          btnHeaterOn.disabled = false;
          btnHeaterOff.disabled = false;
        } else {
          btnFanOn.disabled = false;
          btnFanOff.disabled = false;
        }
      }
    }

    // 1. Initial Snapshot fetch from backend store
    async function fetchInitialSnapshots() {
      const items = ["preheating_tower_dht_temp", "preheating_tower_dht_humidity", "preheating_tower_heater", "preheating_tower_fan"];
      for (const id of items) {
        try {
          const res = await fetch(`${API_BASE}/api/item/${id}`);
          if (res.ok) {
            const data = await res.json();
            handleDataUpdate(id, data.value);
          }
        } catch (e) {}
      }
    }
    fetchInitialSnapshots();

    function handleDataUpdate(itemId, val) {
      if (itemId === "preheating_tower_dht_temp") {
        updateSensor(tempEl, val, 1);
      } else if (itemId === "preheating_tower_dht_humidity") {
        updateSensor(humEl, val, 0);
      } else if (itemId === "preheating_tower_heater" || itemId === "preheating_tower_fan") {
        updateActuatorUI(itemId, val);
      }
    }

    // 2. Real-time WebSocket connection to backend MQTT store
    function connectSocket() {
      const ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "subscribe",
          items: ["preheating_tower_dht_temp", "preheating_tower_dht_humidity", "preheating_tower_heater", "preheating_tower_fan"]
        }));
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "update" && msg.item_id) {
            handleDataUpdate(msg.item_id, msg.value);
          }
        } catch (err) {}
      };
      ws.onclose = () => setTimeout(connectSocket, 2000);
      ws.onerror = () => ws.close();
    }
    connectSocket();
  </script>
</body>
</html>
