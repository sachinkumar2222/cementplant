<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiln Zone Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    ::-webkit-scrollbar {
      display: none;
    }

    .container {
      display: inline-flex;
      padding: 6px;
      background: transparent;
    }

    /* Glassmorphic Compact Card (Perfect Fit for Cupola) */
    .card {
      width: 280px;
      border-radius: 18px;
      padding: 13px 15px;
      color: #ffffff;
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      background: rgba(180, 83, 9, 0.35);
      border: 1px solid rgba(251, 146, 60, 0.45);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), inset 0 0 20px rgba(249, 115, 22, 0.25);
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      box-shadow: 0 14px 36px -5px rgba(0, 0, 0, 0.55), inset 0 0 25px rgba(249, 115, 22, 0.35);
    }

    /* Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      padding-bottom: 8px;
    }
    .card-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-icon {
      font-size: 18px;
      line-height: 1;
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffedd5;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    /* Sensor Grid */
    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .sensor-box {
      background: rgba(15, 23, 42, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      backdrop-filter: blur(8px);
    }
    .sensor-label {
      font-size: 11px;
      font-weight: 700;
      color: #fed7aa;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sensor-value-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 1px;
    }
    .sensor-value {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 10px rgba(249, 115, 22, 0.5);
    }
    .sensor-unit {
      font-size: 14px;
      font-weight: 700;
      color: #fdba74;
    }

    /* Controls Section */
    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      padding-top: 9px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 6px 10px;
      gap: 8px;
    }
    .control-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .control-name {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }
    .control-status-text {
      font-size: 11px;
      font-weight: 600;
      color: #fb923c;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Toggle Buttons */
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .state-btn {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 5px 13px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.10);
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      outline: none;
      transition: all 0.18s ease;
      backdrop-filter: blur(6px);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .state-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.20);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .state-btn:active:not(:disabled) {
      transform: scale(0.96);
    }
    .state-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Active ON / OFF states */
    .state-btn.on.active {
      background: #16a34a;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.65);
    }
    .state-btn.off.active {
      background: #dc2626;
      border-color: #f87171;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.65);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Header -->
      <div class="card-header">
        <div class="card-title-wrap">
          <span class="card-icon">🔥</span>
          <span class="card-title">Kiln (Cline) Zone</span>
        </div>
      </div>

      <!-- Sensor Readings -->
      <div class="sensor-grid">
        <!-- Temperature -->
        <div class="sensor-box">
          <span class="sensor-label">🌡️ Temperature</span>
          <div class="sensor-value-row">
            <span class="sensor-value" id="val-temp">--</span>
            <span class="sensor-unit">°C</span>
          </div>
        </div>

        <!-- Humidity -->
        <div class="sensor-box">
          <span class="sensor-label">💧 Humidity</span>
          <div class="sensor-value-row">
            <span class="sensor-value" id="val-hum">--</span>
            <span class="sensor-unit">%</span>
          </div>
        </div>
      </div>

      <!-- Actuator Controls -->
      <div class="controls-section">
        <!-- Kiln Motor -->
        <div class="control-row">
          <div class="control-info">
            <span class="control-name">Kiln Motor</span>
            <span class="control-status-text" id="status-klin">OFF</span>
          </div>
          <div class="btn-group">
            <button class="state-btn on" id="btn-klin-on" onclick="sendActuatorCommand('klin', 'on')">ON</button>
            <button class="state-btn off active" id="btn-klin-off" onclick="sendActuatorCommand('klin', 'off')">OFF</button>
          </div>
        </div>

        <!-- Kiln Heater -->
        <div class="control-row">
          <div class="control-info">
            <span class="control-name">Kiln Heater</span>
            <span class="control-status-text" id="status-heater">OFF</span>
          </div>
          <div class="btn-group">
            <button class="state-btn on" id="btn-heater-on" onclick="sendActuatorCommand('klin_heater', 'on')">ON</button>
            <button class="state-btn off active" id="btn-heater-off" onclick="sendActuatorCommand('klin_heater', 'off')">OFF</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const backendProtocol = window.location.protocol === "https:" ? "https:" : "http:";
    const websocketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const API_BASE = `${backendProtocol}//${window.location.hostname}:4000`;
    const WS_URL   = `${websocketProtocol}//${window.location.hostname}:4000/ws`;

    // Elements
    const tempEl = document.getElementById("val-temp");
    const humEl = document.getElementById("val-hum");
    const klinStatusEl = document.getElementById("status-klin");
    const heaterStatusEl = document.getElementById("status-heater");

    const btnKlinOn = document.getElementById("btn-klin-on");
    const btnKlinOff = document.getElementById("btn-klin-off");
    const btnHeaterOn = document.getElementById("btn-heater-on");
    const btnHeaterOff = document.getElementById("btn-heater-off");

    function updateSensor(el, val, decimals = 1) {
      if (val === null || val === undefined) {
        el.textContent = "--";
        return;
      }
      const num = Number(val);
      if (isNaN(num)) {
        el.textContent = val;
        return;
      }
      el.textContent = Number.isInteger(num) ? num : num.toFixed(decimals);
    }

    function updateActuatorUI(id, state) {
      const isOn = state === "on";
      if (id === "klin") {
        klinStatusEl.textContent = isOn ? "ON" : "OFF";
        klinStatusEl.style.color = isOn ? "#4ade80" : "#fb923c";
        btnKlinOn.classList.toggle("active", isOn);
        btnKlinOff.classList.toggle("active", !isOn);
        btnKlinOn.disabled = false;
        btnKlinOff.disabled = false;
      } else if (id === "klin_heater") {
        heaterStatusEl.textContent = isOn ? "ON" : "OFF";
        heaterStatusEl.style.color = isOn ? "#4ade80" : "#fb923c";
        btnHeaterOn.classList.toggle("active", isOn);
        btnHeaterOff.classList.toggle("active", !isOn);
        btnHeaterOn.disabled = false;
        btnHeaterOff.disabled = false;
      }
    }

    async function sendActuatorCommand(id, cmd) {
      if (id === "klin") {
        btnKlinOn.disabled = true; btnKlinOff.disabled = true;
      } else if (id === "klin_heater") {
        btnHeaterOn.disabled = true; btnHeaterOff.disabled = true;
      }

      try {
        const res = await fetch(`${API_BASE}/api/item/${id}/action`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: cmd }),
        });
        if (!res.ok) throw new Error("Failed");
        updateActuatorUI(id, cmd);
      } catch (err) {
        console.error("Failed to send command:", err);
      } finally {
        if (id === "klin") {
          btnKlinOn.disabled = false; btnKlinOff.disabled = false;
        } else if (id === "klin_heater") {
          btnHeaterOn.disabled = false; btnHeaterOff.disabled = false;
        }
      }
    }

    // 1. Initial Snapshot fetch from backend store
    async function fetchInitialSnapshots() {
      const items = ["klin_dht_temp", "klin_dht_humidity", "klin", "klin_heater"];
      for (const id of items) {
        try {
          const res = await fetch(`${API_BASE}/api/item/${id}`);
          if (res.ok) {
            const data = await res.json();
            handleDataUpdate(id, data.value);
          }
        } catch (e) {}
      }
    }
    fetchInitialSnapshots();

    function handleDataUpdate(itemId, val) {
      if (itemId === "klin_dht_temp") {
        updateSensor(tempEl, val, 1);
      } else if (itemId === "klin_dht_humidity") {
        updateSensor(humEl, val, 0);
      } else if (itemId === "klin" || itemId === "klin_heater") {
        updateActuatorUI(itemId, val);
      }
    }

    // 2. Real-time WebSocket connection to backend MQTT store
    function connectSocket() {
      const ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "subscribe",
          items: ["klin_dht_temp", "klin_dht_humidity", "klin", "klin_heater"]
        }));
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "update" && msg.item_id) {
            handleDataUpdate(msg.item_id, msg.value);
          }
        } catch (err) {}
      };
      ws.onclose = () => setTimeout(connectSocket, 2000);
      ws.onerror = () => ws.close();
    }
    connectSocket();
  </script>
</body>
</html>
